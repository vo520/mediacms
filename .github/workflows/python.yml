name: Python Tests

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test via Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the stack
        run: docker compose -f docker-compose-dev.yaml build

      - name: Start containers
        run: docker compose -f docker-compose-dev.yaml up -d

      - name: Wait for database and web container
        shell: bash
        run: |
          for attempt in $(seq 1 90); do
            if docker compose -f docker-compose-dev.yaml exec -T db pg_isready -U mediacms && docker compose -f docker-compose-dev.yaml exec -T web true; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose-dev.yaml logs
          exit 1

      - name: Run Django tests
        run: docker compose -f docker-compose-dev.yaml exec --env TESTING=True -T web pytest -n auto --durations=20 --cov --cov-report=term

      - name: Tear down the stack
        if: always()
        run: docker compose -f docker-compose-dev.yaml down --remove-orphans
